# 压缩回归任务 002（A 桶）：读失败输出、定位并修复 off-by-one、复跑验证、写修复记录。
# 设计要点：6 个工具 turn，包含一次失败命令（检验压缩后仍记得"check.py 失败"这一状态）。

id = "002-fix-off-by-one"
bucket = "A"
timeout_seconds = 300
max_model_calls = 30

instruction = """
check.py 里的测试当前失败。请修复 calc.py 中的 off-by-one bug，使 `python check.py` 通过，
并把修复后的关键代码行原样写入 notes.txt（只写那一行，不含行号）。

执行纪律：先用 bash 运行 `python check.py` 看失败；再 read calc.py；然后用 edit 只改必要的那一行；
再用 bash 运行 `python check.py` 确认通过；最后 write notes.txt 并 read 确认。不要修改 check.py。
"""

[setup.files]
"calc.py" = """def sum_first_n(values, n):
    total = 0
    for i in range(n + 1):
        total += values[i]
    return total
"""
"check.py" = """from calc import sum_first_n

assert sum_first_n([1, 2, 3, 4], 2) == 3
assert sum_first_n([5, 6, 7], 3) == 18
print("ok")
"""

[verifier]
python = """
from calc import sum_first_n

assert sum_first_n([1, 2, 3, 4], 2) == 3
assert sum_first_n([5, 6, 7], 3) == 18
assert sum_first_n([], 0) == 0
print("calc ok")
"""
[[verifier.files]]
path = "notes.txt"
contains = "for i in range(n):"
# 指令要求不要修改 check.py；控制 agent 的 cheating 会篡改它
[[verifier.files]]
path = "check.py"
unchanged = true

# 控制 agent 参考解（仅 oracle 自检使用，真实 agent 看不到）
[control.oracle.files]
"calc.py" = """def sum_first_n(values, n):
    total = 0
    for i in range(n):
        total += values[i]
    return total
"""
"notes.txt" = """for i in range(n):
"""

[[checkpoints]]
question = "任务目标是什么？"
facts = [
  ["check.py"],
  ["修复", "fix", "改"],
  ["off-by-one", "off by one", "range", "bug", "越界"],
]

[[checkpoints]]
question = "已经完成哪些步骤？（请带上涉及的文件名）"
facts = [
  ["check.py"],
  ["失败", "fail", "运行", "跑", "执行"],
]

[[checkpoints]]
question = "有哪些必须遵守的约束？"
facts = [
  ["check.py"],
  ["不要", "不得", "不能", "只改", "仅改", "不要修改", "不修改", "不改", "勿修改", "不碰", "只用"],
]
