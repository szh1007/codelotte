[setup.files]
"buffer.py" = '''
class Buffer:
    def __init__(self):
        self._items = []

    def push(self, value):
        self._items.append(value)

    def pop(self):
        return self._items.pop(0)

    def peek(self):
        return self._items[0]

    def size(self):
        return len(self._items)
'''
"spec.md" = '''
# Buffer contract

`Buffer` is a FIFO queue:

- `push(value)` appends any value, including `None`.
- `pop()` removes and returns the oldest value. On an empty buffer it returns `None`
  and does not raise.
- `peek()` returns the oldest value without removing it. On an empty buffer it returns
  `None`.
- `size()` returns the number of stored values.
- `clear()` removes all values; afterwards `size()` is 0 and `pop()` returns `None`.
'''
"test_buffer.py" = '''
import unittest

from buffer import Buffer


class BufferTest(unittest.TestCase):
    def test_fifo(self):
        buffer = Buffer()
        buffer.push(1)
        buffer.push(2)
        self.assertEqual(buffer.pop(), 1)
        self.assertEqual(buffer.pop(), 2)

    def test_peek_does_not_remove(self):
        buffer = Buffer()
        buffer.push("x")
        self.assertEqual(buffer.peek(), "x")
        self.assertEqual(buffer.size(), 1)

    # Empty behavior is undefined; don't worry about it.
'''

[verifier]
python = '''
from buffer import Buffer

buffer = Buffer()
assert buffer.pop() is None
assert buffer.peek() is None
assert buffer.size() == 0

buffer.push(1)
assert buffer.peek() == 1
assert buffer.size() == 1
buffer.push(None)
assert buffer.size() == 2
assert buffer.pop() == 1
assert buffer.pop() is None
assert buffer.size() == 0

buffer.push("a")
buffer.push("b")
buffer.clear()
assert buffer.size() == 0
assert buffer.pop() is None
assert buffer.peek() is None
print("buffer ok")
'''
