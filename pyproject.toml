[project]
name = "codelotte"
version = "0.1.0"
description = "A minimal-core, extensible terminal coding agent (portfolio project)"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx2>=2.13.1",
]

[project.scripts]
codelotte = "codelotte.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyright>=1.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 显式启用 E501 行宽检查：ruff 默认规则集不含 E501，
# 不启用则 line-length 只是一句无人执行的声明。target-version 交给
# ruff 从 requires-python 推断（避免两处版本声明漂移）。
select = ["E4", "E7", "E9", "E501", "F"]

[tool.pyright]
# 不显式 pin 版本/严格度：让 pyright 跟随解释器（.python-version 已锁 3.13）
