[project]
name = "codelotte"
version = "0.1.1"
description = "A minimal-core, extensible terminal coding agent (portfolio project)"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx2>=2.13.1",
    "textual>=8.2.8",
]

[project.scripts]
codelotte = "codelotte.cli:main"

[project.optional-dependencies]
# serve 形态的运行时依赖；不装它时 CLI 行为与 v0.1.x 完全一致（ADR-0010）
serve = [
    "redis>=5.2",
    "confluent-kafka>=2.6",
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyright>=1.1",
    "pytest-textual-snapshot>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Docker 集成套件是独立组：默认冒烟不跑（不阻塞、也不需要 daemon）；要跑用 `pytest -m docker`
addopts = "-m 'not docker and not serve'"
markers = [
    "docker: 需要本机 Docker daemon 的集成测试（可选执行，不阻塞冒烟；票据 10）",
    "serve: 需要 docker compose 起的 Redis/Kafka/PostgreSQL 集成测试（票据 01 起）",
]

[tool.ruff]
line-length = 120
# 跑数目录里的 workspaces/sessions 是被测 agent 的产物（可能故意写坏），不是本项目源码
extend-exclude = ["evals/runs"]

[tool.ruff.lint]
# 显式启用 E501 行宽检查：ruff 默认规则集不含 E501，
# 不启用则 line-length 只是一句无人执行的声明。target-version 交给
# ruff 从 requires-python 推断（避免两处版本声明漂移）。
select = ["E4", "E7", "E9", "E501", "F"]

[tool.pyright]
# 不显式 pin 版本/严格度：让 pyright 跟随解释器（.python-version 已锁 3.13）
# 跑数目录里的 workspaces 是被测 agent 的产物（可能故意写坏），不是本项目源码
exclude = ["evals/runs", "**/__pycache__"]
