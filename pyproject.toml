[project]
name = "codelotte"
version = "0.1.0"
description = "A minimal-core, extensible terminal coding agent (portfolio project)"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
codelotte = "codelotte.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyright>=1.1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
