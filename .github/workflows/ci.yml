name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 目标环境是 Windows 11 + Windows Terminal，因此两个平台都验证
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # 注意：setup-uv 在 v7 之后不再发布浮动主版本 tag（无 v8/v9/v10 ref），
      # 必须用精确版本 pin；升级时手动改这里（或后续接 Dependabot）
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Sync dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q
